DATA.sections.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'section';

let sortMode = 'score';
let topN = 10;

function cardEl(card, displayNum, color) {
  const c = document.createElement('article'); c.className = 'card';
  const num = document.createElement('div'); num.className = 'num';
  num.style.background = color; num.textContent = '#' + displayNum;
  c.appendChild(num);
  const title = document.createElement('a'); title.className = 'title';
  title.textContent = card.title;
  const titleHref = card.aihot || card.original;
  if (titleHref) { title.href = titleHref; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
  c.appendChild(title);
  const meta = document.createElement('div'); meta.className = 'meta-row';
  if (card.source) {
    const chip = document.createElement('span'); chip.className = 'chip';
    chip.textContent = '来源 · ' + card.source;
    meta.appendChild(chip);
  }
  if (card.score !== null && card.score !== undefined) {
    const sc = document.createElement('span'); sc.className = 'score-badge';
    sc.textContent = '评分 ' + card.score;
    meta.appendChild(sc);
  }
  c.appendChild(meta);
  const sum = document.createElement('p'); sum.className = 'summary';
  sum.textContent = card.summary; c.appendChild(sum);
  const foot = document.createElement('div'); foot.className = 'foot';
  const time = document.createElement('span'); time.className = 'time';
  time.textContent = card.time ? (card.time + ' 北京时间') : '';
  foot.appendChild(time);
  const readHref = card.original || card.aihot;
  if (readHref) {
    const read = document.createElement('a'); read.className = 'read';
    read.textContent = '阅读原文 →';
    read.href = readHref; read.target = '_blank'; read.rel = 'noopener noreferrer';
    foot.appendChild(read);
  }
  c.appendChild(foot);
  return c;
}

function renderHot() {
  const ht = DATA.hotTopics;
  const sec = document.createElement('section');
  sec.className = 'hot';
  sec.id = 'sec-hot';
  sec.style.scrollMarginTop = '64px';
  const head = document.createElement('div');
  head.className = 'hot-head';
  const bar = document.createElement('div'); bar.className = 'bar';
  const h2 = document.createElement('h2'); h2.textContent = 'AI 热点榜（48 小时内）';
  const pill = document.createElement('span'); pill.className = 'pill';
  pill.textContent = (ht && ht.items.length) ? (ht.items.length + ' 条 · 近 48 小时') : '暂无';
  head.append(bar, h2, pill);
  sec.appendChild(head);
  const list = document.createElement('div'); list.className = 'hot-list';
  if (!ht || !ht.items.length) {
    const empty = document.createElement('div'); empty.className = 'empty';
    empty.textContent = '数据源近 48 小时暂无热点榜产出，可先浏览下方分类资讯。';
    list.appendChild(empty);
  } else {
    ht.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'hot-row';
      const rank = document.createElement('div');
      rank.className = 'hot-rank' + (it.rank <= 3 ? ' top' : '');
      rank.textContent = it.rank;
      const main = document.createElement('div'); main.className = 'hot-main';
      const title = document.createElement('a'); title.className = 'hot-title';
      title.textContent = it.title;
      /* 标题 → aihot 聚合页（与模型卡片口径一致），original 交由「阅读原文」承载 */
      const href = it.aihot || it.original;
      if (href) { title.href = href; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
      main.appendChild(title);
      const meta = document.createElement('div'); meta.className = 'hot-meta';
      if (it.source) {
        const s = document.createElement('span'); s.className = 'hot-src';
        s.textContent = '来源 · ' + it.source;
        meta.appendChild(s);
      }
      /* 阅读原文：优先 original（真实出处），缺失时回退 aihot 聚合页 */
      const readHref = it.original || it.aihot;
      if (readHref) {
        const rd = document.createElement('a'); rd.className = 'hot-read';
        rd.textContent = '阅读原文 →'; rd.href = readHref;
        rd.target = '_blank'; rd.rel = 'noopener noreferrer';
        meta.appendChild(rd);
      }
      main.appendChild(meta);
      row.append(rank, main);
      list.appendChild(row);
    });
  }
  sec.appendChild(list);
  app.appendChild(sec);
  sectionRefs['hot'] = sec;
}

function render() {
  let counter = 0;
  DATA.sections.forEach(s => {
    const cards = s.cards.slice();
    if (sortMode === 'score') {
      cards.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
    } else {
      cards.sort((a, b) => a.num - b.num);
    }
    const shown = topN > 0 ? cards.slice(0, topN) : cards;
    const pill = sectionPills[s.key];
    if (pill) {
      pill.textContent = (topN > 0 && cards.length > topN)
        ? (topN + ' / ' + cards.length + ' 条')
        : (cards.length + ' 条');
    }
    const grid = sectionGrids[s.key];
    grid.innerHTML = '';
    if (shown.length === 0) {
      const empty = document.createElement('div'); empty.className = 'empty';
      empty.textContent = '本期暂无「' + s.label + '」相关条目。';
      grid.appendChild(empty);
      return;
    }
    shown.forEach(card => {
      counter++;
      grid.appendChild(cardEl(card, counter, s.color));
    });
  });
  const hint = document.getElementById('toolHint');
  if (hint) {
    hint.textContent = '当前显示 ' + counter + ' 条'
      + (topN > 0 ? '（每个分类各取前 ' + topN + ' 条）' : '（全部）')
      + ' · AI 热点榜不参与';
  }
}

const sortSel = document.getElementById('sortSel');
const topSel = document.getElementById('topSel');
if (sortSel) sortSel.addEventListener('change', e => { sortMode = e.target.value; render(); });
if (topSel) topSel.addEventListener('change', e => { topN = parseInt(e.target.value, 10) || 0; render(); });

render();

function syncNavOffset(){
  const sn = document.querySelector('.site-nav');
  if (sn) document.documentElement.style.setProperty('--navh', sn.offsetHeight + 'px');
  const nv = document.getElementById('nav');
  if (nv) document.documentElement.style.setProperty('--nav2h', nv.offsetHeight + 'px');
}
syncNavOffset();
window.addEventListener('resize', syncNavOffset);
window.addEventListener('load', syncNavOffset);

const navLinks = Array.from(nav.querySelectorAll('a'));
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === e.target.id.replace('sec-', '')));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
DATA.sections.forEach(s => { obs.observe(sectionRefs[s.key]); });
if (sectionRefs['hot']) obs.observe(sectionRefs['hot']);
</script>
