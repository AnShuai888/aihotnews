const main = document.getElementById('main');
const nav = document.getElementById('nav');
const esc = t => (t || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hs = document.getElementById('heroStats');
SECTIONS.forEach(s => {
  const e = document.createElement('div');
  e.className = 'stat';
  e.style.borderColor = s.color;
  e.innerHTML = '<span class="stat-n" style="color:' + s.color + '">' + s.count + '</span><span class="stat-l">' + s.name + '</span>';
  hs.appendChild(e);
});
SECTIONS.forEach(s => {
  const a = document.createElement('a');
  a.href = '#sec-' + s.key;
  a.textContent = s.name + ' · ' + s.count;
  a.style.setProperty('--active-bg', s.color);
  nav.appendChild(a);
});
SECTIONS.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'sec';
  sec.id = 'sec-' + s.key;
  const h = document.createElement('h2');
  h.innerHTML = '<span class="dot" style="background:' + s.color + '"></span>' + s.name + '<span class="cnt">' + s.count + ' 条</span>';
  sec.appendChild(h);
  const grid = document.createElement('div');
  grid.className = 'grid';
  DATA.filter(d => d.cat === s.key).forEach(d => {
    const c = document.createElement('article');
    c.className = 'card';
    c.innerHTML = '<div class="card-head"><span class="badge" style="background:' + s.color + '">' + d.n + '</span><a class="title" href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer">' + esc(d.title) + '</a></div><div class="meta"><span class="chip">' + esc(d.source) + '</span><span class="time">' + d.time + '</span></div><p class="summary">' + esc(d.summary) + '</p>';
    grid.appendChild(c);
  });
  sec.appendChild(grid);
  main.appendChild(sec);
});
const links = Array.prototype.slice.call(nav.querySelectorAll('a'));
const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      links.forEach(l => l.classList.remove('active'));
      const link = links.find(l => l.getAttribute('href') === '#' + e.target.id);
      if (link) link.classList.add('active');
    }
  });
}, {rootMargin: '-45% 0px -45% 0px', threshold: 0});
document.querySelectorAll('section.sec').forEach(s => obs.observe(s));
</script>
