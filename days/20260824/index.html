        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = '来源 · ' + card.source;
        c.appendChild(chip);
      }

      const sum = document.createElement('p');
      sum.className = 'summary';
      sum.textContent = card.summary;
      c.appendChild(sum);

      const foot = document.createElement('div');
      foot.className = 'foot';
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = card.date;
      foot.appendChild(time);

      const readHref = card.original || card.aihot;
      if (readHref) {
        const read = document.createElement('a');
        read.className = 'read';
        read.textContent = '阅读原文 →';
        read.href = readHref;
        read.target = '_blank';
        read.rel = 'noopener noreferrer';
        foot.appendChild(read);
      }
      c.appendChild(foot);
      grid.appendChild(c);
    });
  }
  sec.appendChild(grid);
  app.appendChild(sec);
});

// Active nav via IntersectionObserver
const navLinks = Array.from(nav.querySelectorAll('a'));
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === e.target.id.replace('sec-', '')));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
DATA.sections.forEach(s => {
  const el = document.getElementById('sec-' + s.key);
  if (el) obs.observe(el);
});
</script>
</body>
</html>
