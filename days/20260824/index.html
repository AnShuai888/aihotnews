  const num = document.createElement('b');
  num.textContent = s.count;
  el.append(dot, label, num);
  hs.appendChild(el);
});

// Nav
DATA.sections.forEach(s => {
  const a = document.createElement('a');
  a.href = '#sec-' + s.key;
  a.dataset.key = s.key;
  a.style.setProperty('--active-bg', s.color);
  const label = document.createElement('span');
  label.textContent = s.label;
  const c = document.createElement('span');
  c.className = 'c';
  c.textContent = s.count;
  a.append(label, c);
  nav.appendChild(a);
});

// Sections + cards
DATA.sections.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'section';
  sec.id = 'sec-' + s.key;
  /* scroll-margin-top 改由 CSS 控制（含响应式媒体查询） */

  const head = document.createElement('div');
  head.className = 'sec-head';
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.background = s.color;
  const h2 = document.createElement('h2');
  h2.textContent = s.label;
  const pill = document.createElement('span');
  pill.className = 'pill';
  pill.textContent = s.count + ' 条';
  head.append(bar, h2, pill);
  sec.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';

  if (s.cards.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '本期暂无「' + s.label + '」相关条目。';
    grid.appendChild(empty);
  } else {
    s.cards.forEach(card => {
      const c = document.createElement('article');
      c.className = 'card';

      const num = document.createElement('div');
      num.className = 'num';
      num.style.background = s.color;
      num.textContent = '#' + card.num;
      c.appendChild(num);

      const title = document.createElement('a');
      title.className = 'title';
      title.textContent = card.title;
      const titleHref = card.aihot || card.original;
      if (titleHref) { title.href = titleHref; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
      c.appendChild(title);

      if (card.source) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = '来源 · ' + card.source;
        c.appendChild(chip);
      }

      const sum = document.createElement('p');
      sum.className = 'summary';
      sum.textContent = card.summary;
      c.appendChild(sum);

      const foot = document.createElement('div');
      foot.className = 'foot';
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = card.date;
      foot.appendChild(time);

      const readHref = card.original || card.aihot;
      if (readHref) {
        const read = document.createElement('a');
        read.className = 'read';
        read.textContent = '阅读原文 →';
        read.href = readHref;
        read.target = '_blank';
        read.rel = 'noopener noreferrer';
        foot.appendChild(read);
      }
      c.appendChild(foot);
      grid.appendChild(c);
    });
  }
  sec.appendChild(grid);
  app.appendChild(sec);
});

// Active nav via IntersectionObserver
const navLinks = Array.from(nav.querySelectorAll('a'));
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === e.target.id.replace('sec-', '')));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
DATA.sections.forEach(s => {
  const el = document.getElementById('sec-' + s.key);
  if (el) obs.observe(el);
});
</script>
</body>
</html>
