const app = document.getElementById('app');
const nav = document.getElementById('nav');
const COLORS = DATA.sections.map(s => s.color);

// Hero
document.getElementById('heroDate').textContent = DATA.meta.heroDate;
document.getElementById('heroTotal').textContent = DATA.meta.total;
document.getElementById('footTotal').textContent = DATA.meta.total;

const srcEl = document.getElementById('footSource');
srcEl.textContent = DATA.meta.sourceName + '（' + DATA.meta.sourceUrl + '）';
srcEl.href = DATA.meta.sourceUrl;

document.getElementById('footGen').textContent =
  '数据检索时间：' + (DATA.meta.generatedAt || '—');

document.getElementById('footNote').textContent =
  '说明：卡片时间为各条目在北京时间的发布/发现时间；数据源为 AIHOT 全量公开条目池（/api/v1/items），按 2026-08-26 严格筛选。';

// Hero stats
const hs = document.getElementById('heroStats');
DATA.sections.forEach((s) => {
  const el = document.createElement('div');
  el.className = 'stat';
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = s.color;
  const label = document.createElement('span');
  label.textContent = s.label;
  const num = document.createElement('b');
  num.textContent = s.count;
  el.append(dot, label, num);
  hs.appendChild(el);
});

// Nav
DATA.sections.forEach(s => {
  const a = document.createElement('a');
  a.href = '#sec-' + s.key;
  a.dataset.key = s.key;
  a.style.setProperty('--active-bg', s.color);
  const label = document.createElement('span');
  label.textContent = s.label;
  const c = document.createElement('span');
  c.className = 'c';
  c.textContent = s.count;
  a.append(label, c);
  nav.appendChild(a);
});

// Sections + cards（改为可重渲染：结构先建好，卡片由 render() 填充）
const sectionGrids = {};
const sectionRefs = {};
const sectionPills = {};

DATA.sections.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'section';
  sec.id = 'sec-' + s.key;
  sec.style.scrollMarginTop = '64px';

  const head = document.createElement('div');
  head.className = 'sec-head';
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.background = s.color;
  const h2 = document.createElement('h2');
  h2.textContent = s.label;
  const pill = document.createElement('span');
  pill.className = 'pill';
  pill.textContent = s.count + ' 条';
  sectionPills[s.key] = pill;
  head.append(bar, h2, pill);
  sec.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';
  sec.appendChild(grid);
  sectionGrids[s.key] = grid;
  sectionRefs[s.key] = sec;
  app.appendChild(sec);
});

// 默认每个分类各取前 10 条（与下拉框 selected 保持一致；改动需同时改这两处）
let topN = 10;

function cardEl(card, displayNum, color) {
  const c = document.createElement('article');
  c.className = 'card';

  const num = document.createElement('div');
  num.className = 'num';
  num.style.background = color;
  num.textContent = '#' + displayNum;
  c.appendChild(num);

  const title = document.createElement('a');
  title.className = 'title';
  title.textContent = card.title;
  const titleHref = card.aihot || card.original;
  if (titleHref) { title.href = titleHref; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
  c.appendChild(title);

  if (card.source) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = '来源 · ' + card.source;
    c.appendChild(chip);
  }

  const sum = document.createElement('p');
  sum.className = 'summary';
  sum.textContent = card.summary;
  c.appendChild(sum);

  const foot = document.createElement('div');
  foot.className = 'foot';
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = card.date || (card.time ? card.time + ' 北京时间' : '');
  foot.appendChild(time);

  const readHref = card.original || card.aihot;
  if (readHref) {
    const read = document.createElement('a');
    read.className = 'read';
    read.textContent = '阅读原文 →';
    read.href = readHref;
    read.target = '_blank';
    read.rel = 'noopener noreferrer';
    foot.appendChild(read);
  }
  c.appendChild(foot);
  return c;
}

function render() {
  let counter = 0;
  DATA.sections.forEach(s => {
    const cards = s.cards;
    const shown = topN > 0 ? cards.slice(0, topN) : cards;

    const pill = sectionPills[s.key];
    if (pill) {
      pill.textContent = (topN > 0 && cards.length > topN)
        ? (topN + ' / ' + cards.length + ' 条')
        : (cards.length + ' 条');
    }

    const grid = sectionGrids[s.key];
    grid.innerHTML = '';
    if (shown.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '本期暂无「' + s.label + '」相关条目。';
      grid.appendChild(empty);
      return;
    }
    shown.forEach(card => {
      counter++;
      grid.appendChild(cardEl(card, counter, s.color));
    });
  });

  const hint = document.getElementById('toolHint');
  if (hint) {
    hint.textContent = '当前显示 ' + counter + ' 条'
      + (topN > 0 ? '（每个分类各取前 ' + topN + ' 条）' : '（全部）');
  }
}

const topSel = document.getElementById('topSel');
if (topSel) topSel.addEventListener('change', e => { topN = parseInt(e.target.value, 10) || 0; render(); });

render();

// 站点导航高度实测，供分类导航吸顶使用（替代写死的 58px）
function syncNavOffset(){
  const sn = document.querySelector('.site-nav');
  if (sn) document.documentElement.style.setProperty('--navh', sn.offsetHeight + 'px');
}
syncNavOffset();
window.addEventListener('resize', syncNavOffset);
window.addEventListener('load', syncNavOffset);

// Active nav via IntersectionObserver
const navLinks = Array.from(nav.querySelectorAll('a'));
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === e.target.id.replace('sec-', '')));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
DATA.sections.forEach(s => {
  const el = sectionRefs[s.key];
  if (el) obs.observe(el);
});
</script>
