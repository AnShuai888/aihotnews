<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 周报 · 2026-W38（2026-09-14 ~ 2026-09-20）</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --radius:16px; --navh:58px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#0ea5e9 100%);
    color:#fff;padding:48px 24px 40px;text-align:center}
  .hero h1{margin:0;font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:.5px}
  .hero .total{margin:18px 0 6px;font-size:15px;opacity:.95}
  .hero .total b{font-size:30px;font-weight:800;vertical-align:-3px;margin:0 4px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .stat{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;
    padding:8px 16px;font-size:14px;display:flex;align-items:center;gap:8px}
  .stat .dot{width:9px;height:9px;border-radius:50%}
  .stat b{font-weight:700}
  .nav{position:sticky;top:var(--navh);z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
  .nav a{flex:0 0 auto;font-size:14px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px;
    display:flex;align-items:center;gap:6px;transition:.2s;white-space:nowrap;
    background:transparent;--active-bg:#4f46e5}
  .nav a .c{font-weight:700;color:var(--ink)}
  .nav a:hover{background:#f3f4f6}
  .nav a.active{color:#fff;border-color:transparent;background:var(--active-bg)}
  .nav a.active .c{color:#fff}
  .wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px}
  .section{margin:38px 0;scroll-margin-top:64px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .sec-head .bar{width:5px;height:26px;border-radius:3px}
  .sec-head h2{margin:0;font-size:21px;font-weight:800}
  .sec-head .pill{margin-left:auto;font-size:13px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  .sec-desc{margin:0 0 18px;font-size:14px;color:#4b5563;line-height:1.75;
    background:#f8fafc;border-left:3px solid var(--line);padding:10px 14px;border-radius:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    gap:10px;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(16,24,40,.12),0 14px 36px rgba(16,24,40,.10)}
  .card .num{position:absolute;top:0;right:0;font-size:13px;font-weight:800;color:#fff;
    padding:4px 12px;border-bottom-left-radius:14px}
  .card .title{font-size:16px;font-weight:700;line-height:1.45;padding-right:34px;color:var(--ink)}
  .card .title:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
    background:#f3f4f6;border-radius:999px;padding:3px 10px;width:fit-content}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:4px;padding-top:10px;border-top:1px dashed var(--line)}
  .card .read{font-size:13px;font-weight:700;color:#4f46e5;white-space:nowrap}
  .card .read:hover{text-decoration:underline}
  .empty{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line);
    border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:14px}
  footer{max-width:1400px;margin:0 auto;padding:24px 20px 50px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--line)}
  footer a{color:#4f46e5;font-weight:600}
  footer .note{margin-top:8px;font-size:12.5px;opacity:.85}
  @media (max-width:560px){
    .hero{padding:36px 16px 30px}
    .grid{grid-template-columns:1fr}
    .wrap{padding:20px 14px 50px}
  }
  .site-nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .site-nav .inner{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
  .brand{font-size:18px;font-weight:800;color:#4f46e5;letter-spacing:.5px;white-space:nowrap}
  .brand small{display:block;font-size:11px;font-weight:500;color:#6b7280;letter-spacing:.1em}
  .nav-links{display:flex;align-items:center;gap:8px;margin-left:auto;overflow-x:auto;
    min-width:0;scrollbar-width:none;-ms-overflow-style:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{flex:0 0 auto;font-size:14px;color:#6b7280;border:1px solid var(--line);
    border-radius:999px;padding:6px 16px;min-height:44px;display:inline-flex;align-items:center;
    white-space:nowrap;transition:transform .2s,background .2s,color .2s}
  .nav-links a:hover{background:#f3f4f6;transform:translateY(-1px)}
  .nav-links a.active{color:#fff;background:#4f46e5;border-color:transparent}
  .site-footer{max-width:1400px;margin:0 auto;padding:24px 20px 50px;color:#6b7280;font-size:13px;border-top:1px solid var(--line)}
  .site-footer a{color:#4f46e5;font-weight:600}
  .site-footer .note{margin-top:8px;font-size:12.5px;opacity:.85}
  @media (max-width:560px){.brand small{display:none}}
  .toolbar{max-width:1400px;margin:0 auto;padding:16px 20px 0;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .toolbar .theme{font-size:13.5px;font-weight:700;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
  .toolbar .hint{font-size:13px;color:var(--muted)}
  .overview{max-width:1400px;margin:0 auto;padding:18px 20px 0}
  .overview h2{margin:0 0 8px;font-size:17px;font-weight:800}
  .overview p{margin:0;font-size:14px;color:#4b5563;line-height:1.8;
    background:#f8fafc;border-left:3px solid #4f46e5;padding:12px 14px;border-radius:8px}
  @media (max-width:560px){
    .toolbar{padding:12px 14px 0}
    .overview{padding:14px 14px 0}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .card{transition:none}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
  <nav class="site-nav">
    <div class="inner">
      <a class="brand" href="https://aihot.space/">AIhot<small>每日 AI 热点</small></a>
      <div class="nav-links">

  <header class="hero" id="top">

    <div class="stats" id="heroStats">
            <div class="stat"><span class="dot" style="background:#4f46e5"></span><span>独立事件</span><b>66</b></div>

  <nav class="nav" id="nav"></nav>

  <div class="toolbar">

  <div class="overview">
    <h2>本期概览</h2>
    <p>本周AI行业主线是安全与算力并进：一方面，多起事件凸显AI安全紧迫性，包括AI智能体攻击、虚假信息宣传及模型突破隔离；另一方面，英伟达、亚马逊等巨头加码算力，OpenAI自研芯片亮相，模型发布聚焦效率与性能。同时，AI智能体应用加速落地，从企业工具到个人助手，生态日益成熟。</p>
  </div>

  <main class="wrap" id="app"></main>

  <footer>
    <div id="footLine1"></div>
    <div class="note" id="footNote"></div>
  </footer>

  <footer class="site-footer">
    <div>AIhot · 每周 AI 热点聚合 · 数据来源 <a href="https://aihot.virxact.com/weekly" target="_blank" rel="noopener">AIHOT 周报</a></div>
    <!-- 单文件成品（2026-9-21）：数据来自 AIHOT 周报页，整体替换内联 DATA 即可生成其它期周报。 -->
  </footer>

<script>
const DATA = {
  "meta": {
    "heroDate": "AI 周报 · 2026-09-14 ~ 2026-09-20",
    "total": 12,
    "sourceName": "AIHOT",
    "sourceUrl": "https://aihot.virxact.com/weekly",
    "period": "2026-09-14 ~ 2026-09-20",
    "weekNo": "2026-W38",
    "topic": "AIHOT 周报 · 2026-W38",
    "generatedAt": "2026年9月21日"
  },
  "stats": [
    {

          "source": "通义千问",
          "original": "https://aihot.virxact.com/items/cmu5smj860insroqokcuh0u9v"
        },
        {
          "num": 3,
          "title": "Qwen 发布 Qwen3.8-LiveTranslate 实时同传模型，LAAL 降至 2.3 秒",
          "source": "通义千问",
          "original": "https://aihot.virxact.com/items/cmu74vaqy0qeerowkch23r6nd"
        },
        {
          "num": 4,

          "source": "阶跃星辰",

        },
        {
          "num": 5,
          "title": "小红书 AllSpark 开源 Search Agent 模型 Iris，35B 与 397B 版本同量级成绩领先",
          "source": "小红书技术",
          "original": "https://aihot.virxact.com/items/cmu12ocst0b6nro2nypi25zyq"
        }
      ]
    },
    {
      "key": "topic2",
      "label": "行业动态与资本",
      "color": "#10b981",
      "count": 2,
      "desc": "行业动态与资本",
      "cards": [
        {
          "num": 6,
          "title": "Anthropic 计划将 IPO 推迟至 11 月，估值约 2 万亿美元",
          "source": "IT之家",
          "original": "https://aihot.virxact.com/items/cmu7nb3bm0jugrogroyv3fm5h"
        },
        {
          "num": 7,
          "title": "谷歌披露 Gemini 在安全测试中自主入侵三家真实公司并自行终止",
          "source": "IT之家",

        }
      ]
    },
    {
      "key": "products",
      "label": "产品与功能更新",
      "color": "#10b981",
      "count": 4,
      "desc": "产品与功能更新",
      "cards": [
        {
          "num": 8,
          "title": "Apple 发布新一代 Apple Intelligence，Siri AI 正式以测试版上线",
          "source": "Apple",
          "original": "https://aihot.virxact.com/items/cmu1ju3b00pmgrocnrgwe6e9e"
        },
        {
          "num": 9,

          "source": "Anthropic",

        },
        {
          "num": 10,
          "title": "Meta 发布 Muse for Mac，个人智能体可直接在电脑上执行任务",
          "source": "AI at Meta",
          "original": "https://aihot.virxact.com/items/cmu63zp9f09xsrofjmnxvrwdg"
        },
        {
          "num": 11,
          "title": "ChatGPT for Word 上线，OpenAI 员工称 Excel 和 PowerPoint 用量近期激增",
          "source": "Sherwin Wu",
          "original": "https://aihot.virxact.com/items/cmu66hcff0ci8rofjhs1az9qz"
        }
      ]
    },
    {
      "key": "safety",
      "label": "安全、研究与争议",
      "color": "#f59e0b",
      "count": 1,
      "desc": "安全、研究与争议",
      "cards": [
        {
          "num": 12,
          "title": "OpenAI 发布模型失准披露框架并公开六份失准报告",
          "source": "OpenAI",
          "original": "https://aihot.virxact.com/items/cmu4nyoxd07n9rodcxgc06f52"
        }
      ]
    }
  ]
};
const app = document.getElementById('app');
const nav = document.getElementById('nav');
document.getElementById('heroDate').textContent = DATA.meta.heroDate;
document.getElementById('heroTotal').textContent = DATA.meta.total;
/* 脚注：全部由 DATA.meta 变量 + DATA.sections 自动生成；换期只改 DATA，无需改本文案 */
(function () {
  const m = DATA.meta;
  const secCount = DATA.sections.length;
  const secNames = DATA.sections.map(function (s) { return s.label; }).join(' / ');

  const l1 = document.getElementById('footLine1');
  const b = document.createElement('b');
  b.textContent = m.total;
  const a = document.createElement('a');
  a.textContent = m.sourceName + ' 周报页';
  a.href = m.sourceUrl;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  l1.append(
    '本期 AI 周报共收录 ', b, ' 篇，覆盖 ',
    m.period, '（', m.weekNo, '）',
    m.topic ? '，主题「' + m.topic + '」' : '',
    '；整理时间 ', m.generatedAt, '（北京时间），内容整理自 ', a, '。'
  );

  document.getElementById('footNote').textContent =
    '按「' + secNames + '」' + secCount + ' 个专题分组、全局连续编号 1–' + m.total +
    '，每篇标题可点击跳转至 ' + m.sourceName + ' 原文条目；条目卡片仅含标题与来源，逐条发布时间源页面未提供，故未展示。';
})();

const hs = document.getElementById('heroStats');
const sectionGrids = {};
const sectionRefs = {};
const sectionPills = {};

DATA.sections.forEach(s => {
  const el = document.createElement('div');
  el.className = 'stat';
  const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = s.color;
  const label = document.createElement('span'); label.textContent = s.label;
  const num = document.createElement('b'); num.textContent = s.count;
  el.append(dot, label, num);
  hs.appendChild(el);
});

DATA.sections.forEach(s => {
  const a = document.createElement('a');
  a.href = '#sec-' + s.key;
  a.dataset.key = s.key;
  a.style.setProperty('--active-bg', s.color);
  const label = document.createElement('span'); label.textContent = s.label;
  const c = document.createElement('span'); c.className = 'c'; c.textContent = s.count;
  a.append(label, c);
  nav.appendChild(a);
});

DATA.sections.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'section';
  sec.id = 'sec-' + s.key;
  sec.style.scrollMarginTop = '64px';
  const head = document.createElement('div');
  head.className = 'sec-head';
  const bar = document.createElement('div'); bar.className = 'bar'; bar.style.background = s.color;
  const h2 = document.createElement('h2'); h2.textContent = s.label;
  const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = s.count + ' 条';
  sectionPills[s.key] = pill;
  head.append(bar, h2, pill);
  sec.appendChild(head);
  if (s.desc) {
    const d = document.createElement('p'); d.className = 'sec-desc'; d.textContent = s.desc;
    sec.appendChild(d);
  }
  const grid = document.createElement('div'); grid.className = 'grid';
  sec.appendChild(grid);
  sectionGrids[s.key] = grid;
  sectionRefs[s.key] = sec;
  app.appendChild(sec);
});

function cardEl(card, displayNum, color) {
  const c = document.createElement('article'); c.className = 'card';
  const num = document.createElement('div'); num.className = 'num';
  num.style.background = color; num.textContent = '#' + displayNum;
  c.appendChild(num);
  const title = document.createElement('a'); title.className = 'title';
  title.textContent = card.title;
  title.href = card.original; title.target = '_blank'; title.rel = 'noopener noreferrer';
  c.appendChild(title);
  if (card.source) {
    const chip = document.createElement('span'); chip.className = 'chip';
    chip.textContent = '来源 · ' + card.source;
    c.appendChild(chip);
  }
  const foot = document.createElement('div'); foot.className = 'foot';
  const read = document.createElement('a'); read.className = 'read';
  read.textContent = '阅读原文 →';
  read.href = card.original; read.target = '_blank'; read.rel = 'noopener noreferrer';
  foot.appendChild(read);
  c.appendChild(foot);
  return c;
}

function render() {
  let counter = 0;
  DATA.sections.forEach(s => {
    const shown = s.cards.slice();
    const pill = sectionPills[s.key];
    if (pill) pill.textContent = shown.length + ' 条';
    const grid = sectionGrids[s.key];
    grid.innerHTML = '';
    shown.forEach(card => {
      counter++;
      grid.appendChild(cardEl(card, counter, s.color));
    });
  });
  const hint = document.getElementById('toolHint');
  if (hint) hint.textContent = '当前显示 ' + counter + ' 条（共 ' + DATA.meta.total + ' 篇）· 按专题分组';
}

render();

function syncNavOffset(){
  const sn = document.querySelector('.site-nav');
  if (sn) document.documentElement.style.setProperty('--navh', sn.offsetHeight + 'px');
}
syncNavOffset();
window.addEventListener('resize', syncNavOffset);
window.addEventListener('load', syncNavOffset);

const navLinks = Array.from(nav.querySelectorAll('a'));
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === e.target.id.replace('sec-', '')));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
DATA.sections.forEach(s => { obs.observe(sectionRefs[s.key]); });
</script>
</body>
</html>
