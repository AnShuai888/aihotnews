<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 日报 · 2026年8月29日 周六</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --radius:16px; --navh:58px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#0ea5e9 100%);
    color:#fff;padding:48px 24px 40px;text-align:center}
  .hero .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
  .hero h1{margin:0;font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:.5px}
  .hero .total{margin:18px 0 6px;font-size:15px;opacity:.95}
  .hero .total b{font-size:30px;font-weight:800;vertical-align:-3px;margin:0 4px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .stat{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;
    padding:8px 16px;font-size:14px;display:flex;align-items:center;gap:8px}
  .stat .dot{width:9px;height:9px;border-radius:50%}
  .stat b{font-weight:700}
  .nav{position:sticky;top:var(--navh);z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
  .nav a{flex:0 0 auto;font-size:14px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:44px;
    display:flex;align-items:center;gap:6px;transition:.2s;white-space:nowrap;
    background:transparent;--active-bg:#4f46e5}
  .nav a .c{font-weight:700;color:var(--ink)}
  .nav a:hover{background:#f3f4f6}
  .nav a.active{color:#fff;border-color:transparent;background:var(--active-bg)}
  .nav a.active .c{color:#fff}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  .section{margin:38px 0;scroll-margin-top:64px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .sec-head .bar{width:5px;height:26px;border-radius:3px}
  .sec-head h2{margin:0;font-size:21px;font-weight:800}
  .sec-head .pill{margin-left:auto;font-size:13px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    gap:10px;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(16,24,40,.12),0 14px 36px rgba(16,24,40,.10)}
  .card .num{position:absolute;top:0;right:0;font-size:13px;font-weight:800;color:#fff;
    padding:4px 12px;border-bottom-left-radius:14px}
  .card .title{font-size:16px;font-weight:700;line-height:1.45;padding-right:34px;color:var(--ink)}
  .card .title:hover{text-decoration:underline}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
    background:#f3f4f6;border-radius:999px;padding:3px 10px;width:fit-content}
  .card .summary{font-size:14px;color:#374151;margin:0}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:4px;padding-top:10px;border-top:1px dashed var(--line)}
  .card .time{font-size:12.5px;color:var(--muted)}
  .card .read{font-size:13px;font-weight:700;color:#4f46e5;white-space:nowrap}
  .card .read:hover{text-decoration:underline}
  .empty{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line);
    border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:14px}
  footer{max-width:1180px;margin:0 auto;padding:24px 20px 50px;color:var(--muted);font-size:13px;
    border-top:1px solid var(--line)}
  footer a{color:#4f46e5;font-weight:600}
  footer .note{margin-top:8px;font-size:12.5px;opacity:.85}
  @media (max-width:560px){
    .hero{padding:36px 16px 30px}
    .grid{grid-template-columns:1fr}
    .wrap{padding:20px 14px 50px}
  }
  /* 站点级导航（日报页内联，避免引用根站资源） */
  .site-nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .site-nav .inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
  .brand{font-size:18px;font-weight:800;color:#4f46e5;letter-spacing:.5px;white-space:nowrap}
  .brand small{display:block;font-size:11px;font-weight:500;color:#6b7280;letter-spacing:.1em}
  .nav-links{display:flex;align-items:center;gap:8px;margin-left:auto;overflow-x:auto;
    min-width:0;scrollbar-width:none;-ms-overflow-style:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{flex:0 0 auto;font-size:14px;color:#6b7280;border:1px solid var(--line);
    border-radius:999px;padding:6px 16px;min-height:44px;display:inline-flex;align-items:center;
    white-space:nowrap;transition:transform .2s,background .2s,color .2s}
  .nav-links a:hover{background:#f3f4f6;transform:translateY(-1px)}
  .nav-links a.active{color:#fff;background:#4f46e5;border-color:transparent}
  .nav-links a.soon{color:#6b7280;cursor:default;opacity:.7}
  .nav-links a.soon:hover{background:transparent;transform:none}
  .tag-soon{font-size:10px;background:#f5f7fb;border:1px solid var(--line);border-radius:999px;padding:1px 6px;margin-left:6px;color:#6b7280}
  .site-footer{max-width:1180px;margin:0 auto;padding:24px 20px 50px;color:#6b7280;font-size:13px;border-top:1px solid var(--line)}
  .site-footer a{color:#4f46e5;font-weight:600}
  .site-footer .note{margin-top:8px;font-size:12.5px;opacity:.85}
  @media (max-width:560px){.brand small{display:none}}

  /* 工具条：排序 + 显示条数（sticky 跟随滚动；仅作用于下方 5 个分类版块，AI 热点榜不受控） */
  .toolbar{position:sticky;top:calc(var(--navh) + var(--nav2h,52px));z-index:18;
    max-width:1180px;margin:0 auto;padding:12px 20px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .tb-tag{font-size:12.5px;font-weight:700;color:#4f46e5;background:#eef2ff;
    border:1px solid #c7d2fe;border-radius:999px;padding:5px 12px;white-space:nowrap}
  .ctl{appearance:none;-webkit-appearance:none;min-height:44px;font:inherit;font-size:14px;
    font-weight:700;color:var(--ink);background:#fff
    url("data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1.5L6 6.5L11 1.5' fill='none' stroke='%236b7280' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>")
    no-repeat right 14px center;background-size:12px 8px;
    border:1px solid var(--line);border-radius:999px;padding:10px 38px 10px 16px;
    cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
  .ctl:hover{border-color:#a5b4fc}
  .ctl:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}
  .toolbar .hint{font-size:13px;color:var(--muted);margin-left:auto}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (max-width:560px){
    .toolbar{position:static;border-bottom:none;padding:12px 14px 0;gap:8px}
    .tb-tag{flex:1 1 100%;text-align:center;border-radius:8px}
    .ctl{flex:1 1 calc(50% - 4px);min-width:0;font-size:13.5px;padding:10px 34px 10px 14px;
      background-position:right 12px center}
    .toolbar .hint{flex:1 1 100%;margin-left:0;text-align:center}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .card{transition:none}
    .card:hover{transform:none}
  }
  /* 卡片元信息行（来源 + 评分角标） */
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .score-badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;
    color:#b45309;background:#fef3c7;border:1px solid #fde68a;border-radius:999px;
    padding:3px 9px;line-height:1.2}

  /* AI 热点榜模块（hot-topics 近48h快照，暖色强调以区别于分类版块） */
  .hot{margin:30px 0 8px;scroll-margin-top:64px}
  .hot-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .hot-head .bar{width:5px;height:26px;border-radius:3px;
    background:linear-gradient(180deg,#f97316,#ef4444)}
  .hot-head h2{margin:0;font-size:21px;font-weight:800}
  .hot-head .pill{margin-left:auto;font-size:13px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  .hot-list{display:flex;flex-direction:column;gap:10px}
  .hot-row{display:flex;align-items:center;gap:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);
    transition:transform .18s,box-shadow .18s}
  .hot-row:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(239,68,68,.14)}
  .hot-rank{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;
    background:linear-gradient(135deg,#f97316,#ef4444)}
  .hot-rank.top{box-shadow:0 0 0 3px rgba(249,115,22,.18)}
  .hot-main{flex:1 1 auto;min-width:0}
  .hot-title{font-size:15.5px;font-weight:700;line-height:1.45;color:var(--ink);
    text-decoration:none}
  .hot-title:hover{text-decoration:underline}
  .hot-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:7px}
  .hot-src{font-size:12.5px;color:var(--muted);background:#f3f4f6;border-radius:999px;padding:3px 10px}
  /* 热点榜：排名 + 标题(黑字 + 可点 → aihot 聚合页) + 来源 chip + 阅读原文(→original 真实出处)
     指标（信号/信源/来龙去脉）已按 0905 决策移除；
     标题口径与模型卡片完全一致：黑字 var(--ink)、hover 出下划线、<a> 跳转 aihot 聚合页 */
  .hot-read{font-size:13px;font-weight:700;color:#4f46e5;white-space:nowrap;
    text-decoration:none}
  .hot-read:hover{color:#4338ca;text-decoration:underline}
  @media (max-width:560px){
    .hot{margin:22px 0 6px}
    .hot-row{gap:10px;padding:12px}
    .hot-rank{width:30px;height:30px;font-size:14px}
    .hot-title{font-size:14.5px}
  }
</style>
</head>
<body>
  <nav class="site-nav">
    <div class="inner">
      <a class="brand" href="https://aihot.space/">AIhot<small>每日 AI 热点</small></a>
      <div class="nav-links">
        <a href="https://aihot.space/">首页</a>
        <a href="/days/20260829/" class="active">今日新闻</a>
        <a href="/weekly/20260830/">一周新闻</a>
        <a href="https://aihot.space/about/">关于</a>
        <a href="https://aihot.space/contact/">联系</a>
      </div>
    </div>
  </nav>
  <header class="hero" id="top">
    <p class="kicker">AI 日报</p>
    <h1 id="heroDate"></h1>
    <p class="total">今日共收录 <b id="heroTotal"></b> 条 AI 资讯</p>
    <div class="stats" id="heroStats"></div>
  </header>

  <nav class="nav" id="nav"></nav>

  <div class="toolbar">
    <span class="tb-tag">分类资讯</span>
    <label class="sr-only" for="sortSel">排序方式</label>
    <select class="ctl" id="sortSel">
      <option value="score">排序 · 评分优先</option>
      <option value="time">排序 · 时间优先</option>
    </select>
    <label class="sr-only" for="topSel">显示条数</label>
    <select class="ctl" id="topSel">
      <option value="0">显示 · 全部</option>
      <option value="10" selected>显示 · Top 10</option>
      <option value="5">显示 · Top 5</option>
    </select>
    <span class="hint" id="toolHint"></span>
  </div>

  <main class="wrap" id="app"></main>

  <footer>
    <div>本日报共计 <b id="footTotal"></b> 条，数据来源：<a id="footSource" target="_blank" rel="noopener noreferrer"></a>。</div>
    <div class="note" id="footGen"></div>
    <div class="note" id="footNote"></div>
  </footer>

  <footer class="site-footer">
    <div>AIhot · 每日 AI 热点聚合 · 数据来源 <a href="https://aihot.virxact.com" target="_blank" rel="noopener">AIHOT</a></div>
    </footer>

<script>
const DATA = {
  // ============================================================
  //  通用模板：每次生成日报时，只替换下面 const DATA 的内容即可。
  //  其余 HTML / CSS / JS 保持不变。字段含义见行内注释。
  // ============================================================
  // ===== 元信息：Hero 大标题与页脚来源标注 =====
  meta: {
    date: "YYYY-MM-DD",                       // 数据日期（ISO，仅记录用）
    heroDate: "YYYY年M月D日 周X",              // Hero 主标题显示日期，例如 "2026年8月27日 周四"
    total: 5,                                 // 总条数（= 五个版块 cards 之和，生成时填实际值）
    sourceName: "AIHOT",                      // 数据源名称
    sourceUrl: "https://aihot.virxact.com",   // 数据源地址
    generatedNote: "数据检索时间：YYYY年MM月DD日 HH:MM（北京时间）；数据源为 AIHOT 全量公开条目池（/api/v1/items?mode=all&window=24h），默认按评分排序、可切换按时间排序。"
  },
  // ===== 五个固定版块：顺序与 key 固定不要改动；color 与 index.html 配色一致 =====
  // count 生成时填该版块 cards.length（此处示例填 1）
  sections: [
    { key:"models", label:"模型发布 / 更新", color:"#6366f1", count:1, cards:[
      { num:1, section:"models", title:"示例：模型标题", source:"示例来源", time:"8月27日 21:11",
        summary:"示例摘要，不超过60字，展示在卡片正文。", aihot:"https://aihot.virxact.com/items/xxx",
        original:"https://example.com/original", score:84 }
    ]},
    { key:"products", label:"产品发布 / 更新", color:"#10b981", count:1, cards:[
      { num:2, section:"products", title:"示例：产品标题", source:"示例来源", time:"8月27日 20:30",
        summary:"示例摘要，不超过60字，展示在卡片正文。", aihot:"https://aihot.virxact.com/items/xxx",
        original:"https://example.com/original", score:79 }
    ]},
    { key:"industry", label:"行业动态", color:"#f59e0b", count:1, cards:[
      { num:3, section:"industry", title:"示例：行业标题", source:"示例来源", time:"8月27日 19:00",
        summary:"示例摘要，不超过60字，展示在卡片正文。", aihot:"https://aihot.virxact.com/items/xxx",
        original:"https://example.com/original", score:72 }
    ]},
    { key:"papers", label:"论文研究", color:"#3b82f6", count:1, cards:[
      { num:4, section:"papers", title:"示例：论文标题", source:"示例来源", time:"8月27日 18:00",
        summary:"示例摘要，不超过60字，展示在卡片正文。", aihot:"https://aihot.virxact.com/items/xxx",
        original:"https://example.com/original", score:68 }
    ]},
    { key:"tips", label:"技巧与观点", color:"#8b5cf6", count:1, cards:[
      { num:5, section:"tips", title:"示例：技巧标题", source:"示例来源", time:"8月27日 17:00",
        summary:"示例摘要，不超过60字，展示在卡片正文。", aihot:"https://aihot.virxact.com/items/xxx",
        original:"https://example.com/original", score:60 }
    ]}
  ]
};
const app = document.getElementById('app');
const nav = document.getElementById('nav');
document.getElementById('heroDate').textContent = DATA.meta.heroDate;
document.getElementById('heroTotal').textContent = DATA.meta.total;
document.getElementById('footTotal').textContent = DATA.meta.total;
const srcEl = document.getElementById('footSource');
srcEl.textContent = DATA.meta.sourceName + '（' + DATA.meta.sourceUrl + '）';
srcEl.href = DATA.meta.sourceUrl;
document.getElementById('footGen').textContent = DATA.meta.generatedNote;
document.getElementById('footNote').textContent =
  '说明：卡片时间为条目在北京时间的发布/发现时间（慢推信源标注「收录」）；数据源为 AIHOT 全量公开条目池（/api/v1/items?mode=all&window=24h），按时间轴倒序全局连续编号。';

const hs = document.getElementById('heroStats');
const sectionGrids = {};
const sectionRefs = {};
const sectionPills = {};

DATA.sections.forEach(s => {
  const el = document.createElement('div');
  el.className = 'stat';
  const dot = document.createElement('span');
  dot.className = 'dot'; dot.style.background = s.color;
  const label = document.createElement('span'); label.textContent = s.label;
  const num = document.createElement('b'); num.textContent = s.count;
  el.append(dot, label, num);
  hs.appendChild(el);
});

DATA.sections.forEach(s => {
  const a = document.createElement('a');
  a.href = '#sec-' + s.key;
  a.dataset.key = s.key;
  a.style.setProperty('--active-bg', s.color);
  const label = document.createElement('span'); label.textContent = s.label;
  const c = document.createElement('span'); c.className = 'c'; c.textContent = s.count;
  a.append(label, c);
  nav.appendChild(a);
});

// AI 热点榜 导航项（插到分类导航最前面）
const hotNav = document.createElement('a');
hotNav.href = '#sec-hot';
hotNav.dataset.key = 'hot';
hotNav.style.setProperty('--active-bg', '#f97316');
hotNav.textContent = 'AI 热点榜（48 小时内）';
if (nav.firstChild) nav.insertBefore(hotNav, nav.firstChild); else nav.appendChild(hotNav);

renderHot();

DATA.sections.forEach(s => {
  const sec = document.createElement('section');
  sec.className = 'section';
  sec.id = 'sec-' + s.key;
  sec.style.scrollMarginTop = '64px';
  const head = document.createElement('div');
  head.className = 'sec-head';
  const bar = document.createElement('div'); bar.className = 'bar'; bar.style.background = s.color;
  const h2 = document.createElement('h2'); h2.textContent = s.label;
  const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = s.count + ' 条';
  sectionPills[s.key] = pill;
  head.append(bar, h2, pill);
  sec.appendChild(head);
  const grid = document.createElement('div'); grid.className = 'grid';
  sec.appendChild(grid);
  sectionGrids[s.key] = grid;
  sectionRefs[s.key] = sec;
  app.appendChild(sec);
});

let sortMode = 'score';
let topN = 10;

function cardEl(card, displayNum, color) {
  const c = document.createElement('article'); c.className = 'card';
  const num = document.createElement('div'); num.className = 'num';
  num.style.background = color; num.textContent = '#' + displayNum;
  c.appendChild(num);
  const title = document.createElement('a'); title.className = 'title';
  title.textContent = card.title;
  const titleHref = card.aihot || card.original;
  if (titleHref) { title.href = titleHref; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
  c.appendChild(title);
  const meta = document.createElement('div'); meta.className = 'meta-row';
  if (card.source) {
    const chip = document.createElement('span'); chip.className = 'chip';
    chip.textContent = '来源 · ' + card.source;
    meta.appendChild(chip);
  }
  if (card.score !== null && card.score !== undefined) {
    const sc = document.createElement('span'); sc.className = 'score-badge';
    sc.textContent = '评分 ' + card.score;
    meta.appendChild(sc);
  }
  c.appendChild(meta);
  const sum = document.createElement('p'); sum.className = 'summary';
  sum.textContent = card.summary; c.appendChild(sum);
  const foot = document.createElement('div'); foot.className = 'foot';
  const time = document.createElement('span'); time.className = 'time';
  time.textContent = card.time ? (card.time + ' 北京时间') : '';
  foot.appendChild(time);
  const readHref = card.original || card.aihot;
  if (readHref) {
    const read = document.createElement('a'); read.className = 'read';
    read.textContent = '阅读原文 →';
    read.href = readHref; read.target = '_blank'; read.rel = 'noopener noreferrer';
    foot.appendChild(read);
  }
  c.appendChild(foot);
  return c;
}

function renderHot() {
  const ht = DATA.hotTopics;
  const sec = document.createElement('section');
  sec.className = 'hot';
  sec.id = 'sec-hot';
  sec.style.scrollMarginTop = '64px';
  const head = document.createElement('div');
  head.className = 'hot-head';
  const bar = document.createElement('div'); bar.className = 'bar';
  const h2 = document.createElement('h2'); h2.textContent = 'AI 热点榜（48 小时内）';
  const pill = document.createElement('span'); pill.className = 'pill';
  pill.textContent = (ht && ht.items.length) ? (ht.items.length + ' 条 · 近 48 小时') : '暂无';
  head.append(bar, h2, pill);
  sec.appendChild(head);
  const list = document.createElement('div'); list.className = 'hot-list';
  if (!ht || !ht.items.length) {
    const empty = document.createElement('div'); empty.className = 'empty';
    empty.textContent = '暂无可用的「AI 热点榜」快照（近 48 小时抓取失败或未检索）。';
    list.appendChild(empty);
  } else {
    ht.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'hot-row';
      const rank = document.createElement('div');
      rank.className = 'hot-rank' + (it.rank <= 3 ? ' top' : '');
      rank.textContent = it.rank;
      const main = document.createElement('div'); main.className = 'hot-main';
      const title = document.createElement('a'); title.className = 'hot-title';
      title.textContent = it.title;
      /* 标题 → aihot 聚合页（与模型卡片口径一致），original 交由「阅读原文」承载 */
      const href = it.aihot || it.original;
      if (href) { title.href = href; title.target = '_blank'; title.rel = 'noopener noreferrer'; }
      main.appendChild(title);
      const meta = document.createElement('div'); meta.className = 'hot-meta';
      if (it.source) {
        const s = document.createElement('span'); s.className = 'hot-src';
        s.textContent = '来源 · ' + it.source;
        meta.appendChild(s);
      }
      /* 阅读原文：优先 original（真实出处），缺失时回退 aihot 聚合页 */
      const readHref = it.original || it.aihot;
      if (readHref) {
        const rd = document.createElement('a'); rd.className = 'hot-read';
        rd.textContent = '阅读原文 →'; rd.href = readHref;
        rd.target = '_blank'; rd.rel = 'noopener noreferrer';
        meta.appendChild(rd);
      }
      main.appendChild(meta);
      row.append(rank, main);
      list.appendChild(row);
    });
  }
  sec.appendChild(list);
  app.appendChild(sec);
  sectionRefs['hot'] = sec;
}

function render() {
  let counter = 0;
  DATA.sections.forEach(s => {
    const cards = s.cards.slice();
    if (sortMode === 'score') {
      cards.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
    } else {
      cards.sort((a, b) => a.num - b.num);
    }
    const shown = topN > 0 ? cards.slice(0, topN) : cards;
    const pill = sectionPills[s.key];
    if (pill) {
      pill.textContent = (topN > 0 && cards.length > topN)
        ? (topN + ' / ' + cards.length + ' 条')
        : (cards.length + ' 条');
    }
    const grid = sectionGrids[s.key];
    grid.innerHTML = '';
    if (shown.length === 0) {
      const empty = document.createElement('div'); empty.className = 'empty';
      empty.textContent = '本期暂无「' + s.label + '」相关条目。';
      grid.appendChild(empty);
      return;
    }
    shown.forEach(card => {
      counter++;
      grid.appendChild(cardEl(card, counter, s.color));
    });
  });
  const hint = document.getElementById('toolHint');
  if (hint) {
    hint.textContent = '当前显示 ' + counter + ' 条'
      + (topN > 0 ? '（每个分类各取前 ' + topN + ' 条）' : '（全部）')
      + ' · AI 热点榜不参与';
  }
}

const sortSel = document.getElementById('sortSel');
const topSel = document.getElementById('topSel');
if (sortSel) sortSel.addEventListener('change', e => { sortMode = e.target.value; render(); });
if (topSel) topSel.addEventListener('change', e => { topN = parseInt(e.target.value, 10) || 0; render(); });

render();

function syncNavOffset(){
  const sn = document.querySelector('.site-nav');
  if (sn) document.documentElement.style.setProperty('--navh', sn.offsetHeight + 'px');
  const nv = document.getElementById('nav');
  if (nv) document.documentElement.style.setProperty('--nav2h', nv.offsetHeight + 'px');
}
syncNavOffset();
window.addEventListener('resize', syncNavOffset);
window.addEventListener('load', syncNavOffset);

const navLinks = Array.from(nav.querySelectorAll('a'));
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === e.target.id.replace('sec-', '')));
    }
  });
}, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
DATA.sections.forEach(s => { obs.observe(sectionRefs[s.key]); });
if (sectionRefs['hot']) obs.observe(sectionRefs['hot']);
</script>
</body>
